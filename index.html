<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Github Issues Tracker</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

</head>

<body class="login-body">

<div class="login-card">

<div class="logo">
<img src="assets/github-logo.png">
</div>

<h2>GitHub Issues Tracker</h2>
<p class="subtitle">Sign in to manage your issues</p>

  <form class="login-form" onsubmit="login(event)">

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter Username">
      <span class="hint">Default: admin</span>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter Password">
      <span class="hint">Default: admin123</span>
    </div>

    <div class="remember">
      <input type="checkbox" id="remember">
      <label for="remember">Remember me</label>
    </div>

    <button onclick="login()" class="btn btn-dark w-100">Sign In</button>
  </form>
  

<div class="divider">OR</div>

<div class="demo-box">
<p>Demo Credentials:</p>
<p><b>Username:</b> admin</p>
<p><b>Password:</b> admin123</p>
</div>

</div>

<script src="js/login.js"></script>

</body>
</html>
